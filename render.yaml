version: "1"

databases:
  # 1. Auth Database
  - name: auth-db
    databaseName: authdb
    user: synq

  # 2. Team Database
  - name: team-db
    databaseName: teamdb
    user: synq

  # 3. Task Database
  - name: task-db
    databaseName: taskdb
    user: synq

  # 4. Chat Database
  - name: chat-db
    databaseName: chatdb
    user: synq

services:
  # ---- INFRASTRUCTURE ----

  # Managed Redis Cache / Broker
  - type: redis
    name: redis-main
    ipAllowList: []
    # Using Render's managed redis

  # RabbitMQ Broker (Private Service)
  - type: pserv
    name: rabbitmq-main
    env: docker
    dockerContext: .
    dockerfilePath: ./render_rabbitmq.Dockerfile
    ports:
      - port: 5672
      - port: 15672
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: user
      - key: RABBITMQ_DEFAULT_PASS
        value: password
      - key: RABBITMQ_DEFAULT_VHOST
        value: /

  # ---- WEB APIs ----

  - type: web
    name: auth-service
    env: docker
    dockerContext: ./auth_service
    dockerCommand: sh -c "python manage.py wait_for_db && python manage.py migrate && gunicorn auth_service.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auth-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis-main
          property: connectionString
      - key: RABBITMQ_URL
        value: amqp://user:password@rabbitmq-main:5672/

  - type: web
    name: team-service
    env: docker
    dockerContext: ./team_service
    dockerCommand: sh -c "python manage.py migrate && gunicorn team_service.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: team-db
          property: connectionString
      - key: RABBITMQ_URL
        value: amqp://user:password@rabbitmq-main:5672/

  - type: web
    name: task-service
    env: docker
    dockerContext: ./task_service
    dockerCommand: sh -c "python manage.py migrate && gunicorn task_service.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-db
          property: connectionString
      - key: RABBITMQ_URL
        value: amqp://user:password@rabbitmq-main:5672/

  - type: web
    name: chat-service
    env: docker
    dockerContext: ./chat_service
    dockerCommand: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p $PORT chat_service.asgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis-main
          property: connectionString
      - key: RABBITMQ_URL
        value: amqp://user:password@rabbitmq-main:5672/
      - key: DJANGO_SETTINGS_MODULE
        value: chat_service.settings

  # ---- WORKERS ----

  - type: worker
    name: auth-worker
    env: docker
    dockerContext: ./auth_service
    dockerCommand: celery -A auth_service worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auth-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis-main
          property: connectionString
      - key: RABBITMQ_URL
        value: amqp://user:password@rabbitmq-main:5672/

  - type: worker
    name: auth-rpc-worker
    env: docker
    dockerContext: ./auth_service
    dockerCommand: python rabbit.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auth-db
          property: connectionString
      - key: RABBITMQ_URL
        value: amqp://user:password@rabbitmq-main:5672/

  - type: worker
    name: team-rpc-worker
    env: docker
    dockerContext: ./team_service
    dockerCommand: python -u teams/rpc_server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: team-db
          property: connectionString
      - key: RABBITMQ_URL
        value: amqp://user:password@rabbitmq-main:5672/

  - type: worker
    name: task-rpc-worker
    env: docker
    dockerContext: ./task_service
    dockerCommand: python tasks/rpc_worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-db
          property: connectionString
      - key: RABBITMQ_URL
        value: amqp://user:password@rabbitmq-main:5672/
